# Collimo pour Windows : tests, construction de l'installeur et de la version portable,
# puis test de bout en bout sur l'application réellement installée (installation silencieuse, sans droits
# d'administrateur), sur une machine Windows de GitHub.
# Les fichiers produits sont téléchargeables dans l'onglet « Actions », rubrique « Artifacts ».
# Sur main, la version de package.json est publiée en « Release » GitHub (vX.Y.Z, avec les deux .exe)
# si elle ne l'est pas déjà : pour publier une nouvelle version, il suffit d'augmenter `version`.
name: Application Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Modules
        run: npm ci --no-audit --no-fund

      - name: Types, lint et tests automatiques
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Construction (installeur et version portable)
        run: npm run desktop:pack

      - name: Test de bout en bout (application non installée)
        run: node tools/e2e-desktop.mjs --exe release/win-unpacked/Collimo.exe

      - name: Installation silencieuse, puis test de l'application installée
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter 'Collimo-Setup-*.exe' | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Collimo\Collimo.exe'
          if (-not (Test-Path $exe)) { throw "Collimo.exe absent après installation : $exe" }
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'Collimo.lnk'
          if (-not (Test-Path $lnk)) { throw "Raccourci du menu Démarrer absent : $lnk" }
          (Get-Item $exe).VersionInfo | Format-List ProductName, FileDescription, ProductVersion, LegalCopyright
          node tools/e2e-desktop.mjs --exe $exe
          if ($LASTEXITCODE -ne 0) { throw "Test de l'application installée en échec" }

      - name: Désinstallation silencieuse
        shell: pwsh
        run: |
          $un = Join-Path $env:LOCALAPPDATA 'Programs\Collimo\Uninstall Collimo.exe'
          Start-Process -FilePath $un -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'Programs\Collimo\Collimo.exe')) { throw 'Collimo.exe toujours présent après désinstallation' }

      - name: Captures d'écran des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-tests
          path: test-results/
          if-no-files-found: ignore

      - name: Installeur et version portable
        uses: actions/upload-artifact@v4
        with:
          name: Collimo-Windows
          path: |
            release/Collimo-Setup-*.exe
            release/Collimo-*-portable.exe

      - name: Publication de la version (main)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $v = 'v' + (node -p "require('./package.json').version")
          gh release view $v *> $null
          if ($LASTEXITCODE -eq 0) { "Version $v déjà publiée : rien à faire."; exit 0 }
          $files = (Get-ChildItem release -Filter 'Collimo-*.exe').FullName
          gh release create $v $files --target $env:GITHUB_SHA --title "Collimo $v" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "Publication de $v impossible" }
